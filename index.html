<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raj Dairy Khata</title>
<meta name="theme-color" content="#4DB04A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* Phone pe "Desktop site" chalu ho to bhi phone jaisa dikhe */
(function(){function fit(){try{var sw=Math.min(screen.width,screen.height)>0&&window.matchMedia("(pointer:coarse)").matches?(window.innerWidth>window.innerHeight?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height)):0;
var de=document.documentElement;de.style.zoom="";var w=window.innerWidth;
if(sw&&sw<820&&w>sw*1.25){de.style.zoom=(w/sw).toFixed(3)}}catch(e){}}
fit();window.addEventListener("resize",fit);window.addEventListener("orientationchange",function(){setTimeout(fit,300)})})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: anime-style morning farm. Illustrated layered scene on top, game-UI panels (brown outline + cream inner ring), glossy pill buttons, wooden tab bar. Single light look on purpose. */
:root{
  color-scheme:light;
  --line:#4A3220; --line-soft:#8C6A48;
  --paper:#FFFBF0; --paper2:#FFF3D6; --ring:#FFF8E6;
  --grass:#4DB04A; --grass-hi:#7BD86A; --grass-dk:#2E7D32;
  --sky:#7CCBF2; --barn:#D2452F; --barn-hi:#F0705A; --barn-dk:#8F2A1C;
  --hay:#FFC94A; --hay-hi:#FFE38A; --hay-dk:#D99A12;
  --wood:#B97A45; --wood-hi:#D9A066; --wood-dk:#7A4B26;
  --ink:#3A2717; --muted:#7B6650;
  --ok:#3E9E4B; --ok-soft:#DDF4D3; --bad:#E04A3B; --bad-soft:#FFE3DC; --off-soft:#EEE8DD;
  --chalk:#29453A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Mukta","Segoe UI",system-ui,sans-serif;
  --drop:0 4px 0 rgba(74,50,32,.9),0 10px 18px rgba(74,50,32,.18);
}
html,body{height:100%}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent;
  background-color:#F4F1DE;
  background-image:
   radial-gradient(ellipse 120% 60% at 50% 0%,#FFF7DF 0%,transparent 60%),
   radial-gradient(circle at 12px 12px,rgba(77,176,74,.12) 2px,transparent 3px),
   radial-gradient(circle at 32px 30px,rgba(255,201,74,.16) 2px,transparent 3px);
  background-size:auto,44px 44px,44px 44px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--barn);outline-offset:2px}

/* ---------- scene ---------- */
.scene{position:relative;overflow:hidden;border-bottom:3px solid var(--line);box-shadow:0 6px 0 rgba(74,50,32,.25)}
.scene>svg{display:block;width:100%;height:auto;max-height:250px}
.sign{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:10px;display:grid;justify-items:center;transform-origin:50% 0}
.sign .rope{width:70%;height:16px;border-left:3px solid var(--wood-dk);border-right:3px solid var(--wood-dk)}
.sign .plank{position:relative;padding:4px 16px 6px;border:2.5px solid var(--line);border-radius:12px;
  background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(122,75,38,.18) 7px 8px),linear-gradient(var(--wood-hi),var(--wood) 55%,var(--wood-dk));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.15),0 6px 12px rgba(58,39,23,.35)}
.sign .plank::before,.sign .plank::after{content:"";position:absolute;top:6px;width:6px;height:6px;border-radius:50%;background:#5B5B5B;box-shadow:inset -1px -1px 0 #2a2a2a}
.sign .plank::before{left:6px}.sign .plank::after{right:6px}
.sign h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.05;color:#FFF6DE;
  text-shadow:0 2px 0 var(--wood-dk),2px 2px 0 var(--wood-dk),-1px -1px 0 rgba(0,0,0,.15)}
.sign p{margin:0;text-align:center;font-size:.8rem;font-weight:800;color:var(--hay-hi);text-shadow:0 1px 0 var(--wood-dk)}

/* ---------- layout ---------- */
main{padding-block:18px 124px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:520px;margin:0 auto;display:grid;gap:16px}
.card{position:relative;background:linear-gradient(var(--paper),var(--paper2));border:2.5px solid var(--line);border-radius:22px;padding:14px;
  box-shadow:inset 0 0 0 3px var(--ring),inset 0 -4px 0 rgba(185,122,69,.12),var(--drop);min-width:0}
.small{font-size:.9rem;color:var(--muted)}
.banner{border:2.5px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),var(--drop)}
.banner.warn{background:linear-gradient(#FFF0EC,var(--bad-soft))}
.banner.info{background:linear-gradient(var(--hay-hi),var(--hay))}

/* glossy buttons */
.gloss,.chunk,.nav,.kal,.step,.toggle,.save,.tabs button,.strip,.gear,.cowcard,.tile,.task,.botbtn,.botcard{position:relative;overflow:hidden;border:2.5px solid var(--line);font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.14),var(--drop);transition:transform .08s}
.gloss::after,.chunk::after,.nav::after,.kal::after,.step::after,.toggle::after,.save::after,.tabs button::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:38%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.gloss:active,.chunk:active,.nav:active,.kal:active,.step:active,.toggle:active,.save:active,.tabs button:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 1px 0 rgba(74,50,32,.9)}
.chunk{border-radius:14px;padding:8px 14px;background:linear-gradient(#FFFFFF,#F1E7D3)}
.chunk.red{background:linear-gradient(var(--barn-hi),var(--barn));color:#fff;text-shadow:0 1px 0 var(--barn-dk)}
.chunk.green{background:linear-gradient(var(--grass-hi),var(--grass));color:#fff;text-shadow:0 1px 0 var(--grass-dk)}

/* date board */
.datebar{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:10px}
.nav{height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--hay-hi),var(--hay) 55%,var(--hay-dk));font-size:1.9rem;line-height:1;color:var(--wood-dk)}
.nav:disabled{opacity:.35;filter:grayscale(.6)}
.board{position:relative;text-align:center;padding:5px 8px 7px;color:#FFF6DE;border:2.5px solid var(--line);border-radius:14px;
  background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(122,75,38,.2) 9px 10px),linear-gradient(var(--wood-hi),var(--wood) 60%,var(--wood-dk));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3),var(--drop)}
.board b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;text-shadow:0 2px 0 var(--wood-dk)}
.board span{font-weight:700;font-size:.9rem}
.tag{display:inline-block;margin-left:6px;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:800;background:linear-gradient(var(--grass-hi),var(--grass));color:#fff;border:2px solid var(--line);text-shadow:0 1px 0 var(--grass-dk)}
.tag.old{background:linear-gradient(var(--hay-hi),var(--hay));color:var(--ink);text-shadow:none}

/* kal jaisa */
.kal{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;border-radius:20px;background:linear-gradient(var(--hay-hi),var(--hay) 60%,#F7B731);padding:8px 14px;text-align:left}
.kal b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.1}
.kal small{display:block;font-weight:600;font-size:.88rem}

/* milk cards */
.milk{display:grid;gap:10px;padding-top:24px;margin-top:10px}
.milk.am{background:linear-gradient(#FFE9C7,#FFF8EA 55%)}
.milk.pm{background:linear-gradient(#DCDDFB,#F7F5FF 55%)}
.ribbon{position:absolute;left:12px;top:-16px;display:flex;align-items:center;gap:6px;padding:2px 14px 2px 6px;border:2.5px solid var(--line);border-radius:99px;
  background:linear-gradient(var(--grass-hi),var(--grass));color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 rgba(74,50,32,.9)}
.pm .ribbon{background:linear-gradient(#8F8CEB,#5B57C9)}
.ribbon h2{margin:0;font-family:var(--display);font-size:1.15rem;line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.ribbon svg{margin:-10px 0 -8px}
.mtop{display:flex;justify-content:flex-end}
.milk .sum{font-family:var(--display);font-weight:800;font-size:1.05rem;background:#fff;border:2px solid var(--line);border-radius:99px;padding:0 12px;white-space:nowrap;position:absolute;right:12px;top:-14px;box-shadow:0 3px 0 rgba(74,50,32,.9)}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:stretch}
.step{border-radius:18px;min-height:60px;font-size:2rem;line-height:1;background:linear-gradient(var(--grass-hi),var(--grass) 60%,#3E9A3C);color:#fff;text-shadow:0 2px 0 var(--grass-dk)}
.step.minus{background:linear-gradient(#FFFFFF,#EDE3CF);color:var(--wood-dk);text-shadow:none}
.gram .step{min-height:50px;font-size:1.6rem;background:linear-gradient(#B6EC9C,#86D46E);color:var(--grass-dk);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.gram .step.minus{background:linear-gradient(#FFFFFF,#EDE3CF);color:var(--wood-dk)}
.numwrap{position:relative;min-width:0}
.numwrap input{width:100%;height:60px;border-radius:18px;border:2.5px solid var(--line);background:linear-gradient(#FFFFFF,#FFF7E3);text-align:center;font-family:var(--display);font-size:2rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;padding-right:54px;box-shadow:inset 0 3px 0 rgba(74,50,32,.08)}
.gram .numwrap input{height:50px;font-size:1.5rem}
.numwrap em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;font-size:.72rem;color:var(--muted);background:var(--paper2);border-radius:6px;padding:0 5px}
.stepper.off{opacity:.3;pointer-events:none}

.total{display:flex;align-items:center;gap:12px;color:#fff;background:linear-gradient(var(--grass-hi),var(--grass) 55%,#3B9439);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),var(--drop)}
.total b{display:block;font-family:var(--display);font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--grass-dk)}
.total span{font-weight:700;display:block;text-shadow:0 1px 0 var(--grass-dk)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{min-width:0}
.field label{display:block;font-weight:800;margin-bottom:4px}
.field input{width:100%;height:56px;border-radius:16px;border:2.5px solid var(--line);background:linear-gradient(#FFFFFF,#FFF7E3);padding:0 12px;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:inset 0 3px 0 rgba(74,50,32,.08)}
.toggle{width:100%;min-height:56px;border-radius:16px;background:linear-gradient(#FFFFFF,#EFE5D1)}
.toggle[aria-pressed="true"]{background:linear-gradient(#E5DED2,#CFC6B6)}
.save{width:100%;min-height:70px;border-radius:22px;color:#fff;font-family:var(--display);font-size:1.65rem;
  background:linear-gradient(var(--barn-hi),var(--barn) 55%,#B83725);text-shadow:0 2px 0 var(--barn-dk)}
.save.clean{background:linear-gradient(#F0FBEA,var(--ok-soft));color:var(--grass-dk);text-shadow:none}
.save.green{background:linear-gradient(var(--grass-hi),var(--grass) 55%,#3B9439);text-shadow:0 2px 0 var(--grass-dk)}
.save:disabled{opacity:.6}
.err{color:var(--bad);font-weight:800;min-height:1.2em;margin:0;text-align:center}
.del{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:700;padding:6px}

/* hisaab */
.slate{position:relative;text-align:center;color:#F4F8EF;padding:16px 14px 14px;border-radius:18px;border:2.5px solid var(--line);
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 60%),linear-gradient(#335447,var(--chalk));
  box-shadow:inset 0 0 0 8px var(--wood),inset 0 0 0 10px var(--wood-dk),inset 0 0 22px 10px rgba(0,0,0,.35),var(--drop)}
.slate p{margin:0;font-weight:700;opacity:.92}
.slate b{display:block;font-family:var(--display);font-size:2.8rem;line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 0 6px rgba(255,255,255,.25)}
.slate .chalk{position:absolute;right:20px;bottom:12px;width:26px;height:7px;border-radius:3px;background:#FAFAF4;transform:rotate(-12deg);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:8px;border-radius:18px}
.stat span{display:block;font-size:.78rem;font-weight:700;color:var(--muted);line-height:1.2}
.stat b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:.7rem;font-weight:800;text-align:center;color:var(--muted)}
.day{aspect-ratio:1/1.1;max-width:100%;min-width:0;border:2px solid var(--line);border-radius:12px;background:linear-gradient(#fff,#F6EEDC);display:grid;place-items:center;align-content:center;padding:2px;font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 2px 0 rgba(74,50,32,.8)}
.day b{font-family:var(--display);font-size:1.05rem;line-height:1}
.day small{font-size:.6rem;font-weight:700;line-height:1.1}
.day.done{background:linear-gradient(#EFFBE8,#C9EDB9)}
.day.miss{background:linear-gradient(#F47466,var(--bad));color:#fff}
.day.no{background:linear-gradient(#F6F2EA,#E2DACB);color:var(--muted)}
.day.future{border-style:dashed;opacity:.45;box-shadow:none}
.day.today{outline:3px solid var(--hay-dk);outline-offset:1px}
.day.blank{border:0;background:transparent;box-shadow:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-radius:4px;vertical-align:-2px;margin-right:4px}
.lines{display:grid;gap:4px}
.lines div{display:flex;justify-content:space-between;gap:8px}
.lines .sumline{border-top:2px dashed var(--line-soft);padding-top:4px;font-weight:800}
textarea.billtxt{width:100%;min-height:180px;border:2px solid var(--line);border-radius:12px;padding:8px;font-size:.85rem;background:#fff}

/* settings */
.set{display:grid;gap:12px}
.set h2{margin:0;font-family:var(--display);font-size:1.3rem}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.hist li{display:flex;justify-content:space-between;border-bottom:2px dashed #DCCDB0;padding:4px 0}
.help ol{margin:6px 0 0;padding-left:1.3em;display:grid;gap:6px;font-weight:600}
main.entry{padding-bottom:230px}
select{font:inherit;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.field input,.field select,.lg4 input,.pgrp input,.numwrap input{color:var(--ink);-webkit-text-fill-color:var(--ink)}
.field input::placeholder{color:#9C8A74;-webkit-text-fill-color:#9C8A74}
.field input[type=date]{font-size:1rem;padding:0 6px;min-width:0;letter-spacing:-.2px}
.field input[type=date]::-webkit-calendar-picker-indicator{margin-left:2px;padding:0;width:18px;height:18px}
.field select{font-size:.95rem;padding:0 6px;text-overflow:ellipsis}
.milk .sum{position:static;justify-self:end;margin:-8px 0 -2px;right:auto;top:auto}
@media (max-width:380px){.ribbon h2{font-size:1.02rem}}


.cowsay{position:absolute;left:44%;top:9%;max-width:40%;font-size:.88rem;background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.15;color:var(--ink);box-shadow:0 4px 0 var(--line);transform:scale(0);transform-origin:0% 100%;transition:transform .18s ease-out;pointer-events:none;z-index:3}
.cowsay::after{content:"";position:absolute;left:10px;bottom:-11px;border:9px solid transparent;border-top-color:var(--line);border-bottom:0}
.cowsay.show{transform:scale(1)}
.moo{opacity:0}.shades{opacity:0;transition:opacity .2s}
.scene.party .shades{opacity:1}.scene.talk .moo{opacity:1}
.notes text{opacity:0}
@media (prefers-reduced-motion:no-preference){
 .cowdance{transform-box:fill-box;transform-origin:50% 100%;animation:cdance 1.4s ease-in-out infinite}
 @keyframes cdance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5px) rotate(-3deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-5px) rotate(3deg)}}
 .cowhead{transform-box:fill-box;transform-origin:50% 85%;animation:chead 1.4s ease-in-out infinite}
 @keyframes chead{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
 .legA,.legB{transform-box:fill-box;transform-origin:50% 0;animation:kick .7s ease-in-out infinite alternate}
 .legB{animation-delay:-.35s}
 @keyframes kick{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
 .bell{transform-box:fill-box;transform-origin:50% 0;animation:ding .35s ease-in-out infinite alternate}
 @keyframes ding{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
 .cowshadow{transform-box:fill-box;transform-origin:50% 50%;animation:shad .7s ease-in-out infinite alternate}
 @keyframes shad{to{transform:scaleX(.82)}}
 .notes text{animation:note 2.4s linear infinite}
 .notes text:nth-child(2){animation-delay:.8s}.notes text:nth-child(3){animation-delay:1.6s}
 @keyframes note{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-34px)}}
 .scene.party .cowdance{animation:cspin 1s ease-in-out}
 @keyframes cspin{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-26px) rotate(-12deg)}70%{transform:translateY(-10px) rotate(14deg)}100%{transform:translateY(0) rotate(0)}}
 .scene.party .legA,.scene.party .legB{animation-duration:.18s}
}


.speed{opacity:0}
.hoof{opacity:0;transition:opacity .15s}.scene.byebye .hoof{opacity:1}.scene.byebye .legA{opacity:0}
@media (prefers-reduced-motion:no-preference){
 .ride{animation:ride 11s linear infinite}
 @keyframes ride{from{transform:translateX(-414px)}to{transform:translateX(216px)}}
 .bump{animation:bump .32s ease-in-out infinite alternate}
 @keyframes bump{to{transform:translateY(-1.6px)}}
 .wheel{transform-box:fill-box;transform-origin:50% 50%;animation:spin .45s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 .speed{opacity:.85;animation:sp .3s linear infinite alternate}@keyframes sp{to{opacity:.3}}
 .rajdance{transform-box:fill-box;transform-origin:30% 100%;animation:rdance .8s ease-in-out infinite}
 @keyframes rdance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-5deg) translateY(-2px)}75%{transform:rotate(5deg) translateY(-2px)}}
 .rajhead{transform-box:fill-box;transform-origin:50% 100%;animation:rhead .8s ease-in-out infinite}
 @keyframes rhead{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
 .armwave{transform-box:fill-box;transform-origin:100% 100%;animation:wave .4s ease-in-out infinite alternate}
 @keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
 .scene.rajparty .rajdance{animation:rjump .7s ease-in-out}
 @keyframes rjump{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-14px) rotate(-14deg)}100%{transform:translateY(0) rotate(0)}}
}


@media (prefers-reduced-motion:no-preference){
 .hoof{transform-box:view-box;transform-origin:138px 176px;animation:hoofwave .3s ease-in-out infinite alternate}
 @keyframes hoofwave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
 .scene.byebye .legA{animation:none}
 .scene.byebye .cowhead{animation:byehead .6s ease-in-out infinite alternate}
 @keyframes byehead{from{transform:rotate(6deg)}to{transform:rotate(16deg)}}
 .scene.byebye .cowdance{animation:none}
 .scene.byebye .armwave{animation-duration:.22s}
}

.savetime{font-size:.8rem;font-weight:700;display:block;margin-top:-2px;font-family:var(--body)}
.ava{position:relative;display:inline-block;flex:none;border-radius:50%;overflow:hidden;background:#fff;border:2.5px solid var(--line);box-shadow:0 3px 0 rgba(74,50,32,.9)}
.ava svg{position:absolute;inset:8%;width:84%;height:84%}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hello{display:flex;align-items:center;gap:12px;background:linear-gradient(#FFF3C9,var(--paper2))}
.hello b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.05}
.hello span{display:block;font-weight:700}
.hello small{display:block;color:var(--muted);font-weight:600}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:4px;text-align:center;padding:10px 6px;cursor:pointer}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;border-top:3px solid var(--line);
 background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(122,75,38,.25) 11px 12px),linear-gradient(var(--wood-hi),var(--wood) 50%,var(--wood-dk));
 box-shadow:0 -6px 14px rgba(58,39,23,.2);
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs::before{content:"";position:absolute;left:0;right:0;top:-14px;height:12px;pointer-events:none;

@media (prefers-reduced-motion:no-preference){
 .toast{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
 .c1{animation:drift 60s linear infinite}.c2{animation:drift 85s linear infinite -30s}
 @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(480px)}}
 .tail{transform-box:fill-box;transform-origin:0% 0%;animation:wag 2.6s ease-in-out infinite}@keyframes wag{50%{transform:rotate(16deg)}}
 .lid{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(0);animation:blink 4.5s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
 .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}
 .bfly{animation:fly 9s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(18px,-10px)}50%{transform:translate(36px,4px)}75%{transform:translate(14px,8px)}}
 .wing{transform-box:fill-box;transform-origin:100% 50%;animation:flap .35s ease-in-out infinite alternate}@keyframes flap{to{transform:scaleX(.35)}}
 .sign{animation:swing 5s ease-in-out infinite}@keyframes swing{50%{transform:rotate(-2.5deg)}}
}

<script>
/* ---- Phone storage (no login): replaces Claude storage ---- */
(function(){
const KEY="rdk_db_v1",IMG="rdk_img_";
let docs={};try{docs=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(_){docs={}}
const subs=[];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(docs))}catch(e){throw{code:"too_large",message:"Phone me jagah kam hai"}}}
function snap(id,d){return{id,exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):d,metadata:{}}}
function notify(){subs.slice().forEach(f=>setTimeout(f,0))}
const db={
 doc:p=>({
  get:async()=>snap(p.split("/")[1],docs[p]),
  set:async b=>{const old=docs[p];docs[p]=JSON.parse(JSON.stringify(b));try{persist()}catch(e){if(old===undefined)delete docs[p];else docs[p]=old;throw e}notify()},
  delete:async()=>{const old=docs[p];delete docs[p];try{persist()}catch(e){docs[p]=old;throw e}notify()},
  onSnapshot:n=>{const f=()=>n(snap(p.split("/")[1],docs[p]));subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}
 }),
 collection:c=>({onSnapshot:n=>{const f=()=>n({docs:Object.keys(docs).filter(k=>k.startsWith(c+"/")).map(k=>snap(k.slice(c.length+1),docs[k]))});subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}})
};
const toData=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
const assets={upload:async blob=>{const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const d=await toData(blob);try{localStorage.setItem(IMG+id,d)}catch(e){throw{code:"too_large"}}return{id}}};
async function giveFile(name,data,type){
  const blob=new Blob([data],{type:type||"text/plain"});
  try{const f=new File([blob],name,{type:type||"text/plain"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return{status:"saved"}}}catch(e){if(e&&e.name==="AbortError")return{status:"cancelled"}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return{status:"saved"};
}
window.RDK={
  img:id=>{try{return localStorage.getItem(IMG+id)||""}catch(_){return""}},
  giveFile,
  backup:()=>{const imgs={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(IMG))imgs[k.slice(IMG.length)]=localStorage.getItem(k)}}catch(_){}
    return JSON.stringify({app:"RajDairyKhata",v:1,at:new Date().toISOString(),docs,imgs})},
  restore:txt=>{const o=JSON.parse(txt);if(!o||o.app!=="RajDairyKhata"||typeof o.docs!=="object")throw new Error("bad");
    const keep=docs;docs=o.docs;try{persist()}catch(e){docs=keep;throw e}
    try{Object.entries(o.imgs||{}).forEach(([k,v])=>localStorage.setItem(IMG+k,v))}catch(_){}
    notify();return Object.keys(docs).filter(k=>k.startsWith("entries/")).length},
  count:()=>Object.keys(docs).length
};
window.claude={use:async n=>n==="db"?db:n==="user"?{can:async()=>true}:n==="assets"?assets:n==="downloads"?{save:async r=>giveFile(r.filename,r.data,"text/csv")}:null};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>

function rateFor(date){
  const r=(S.settings&&S.settings.rates||[]).slice().sort((a,b)=>a.from<b.from?-1:1);
  let v=r.length?r[0].rate:0;for(const x of r){if(x.from<=date)v=x.rate}return Number(v)||0;
}
const curRate=()=>rateFor(today());
const litres=e=>e?(Number(e.s)||0)+(Number(e.e)||0):0;
function missingDays(){const out=[];let d=START;const t=today();while(d<t){if(!S.entries[d])out.push(d);d=addDays(d,1)}return out}
function monthCalc(ym){
  const first=ym+"-01";const[y,m]=ym.split("-").map(Number);
  const last=ym+"-"+pad(new Date(y,m,0).getDate());
  let prev=Number(S.settings&&S.settings.opening)||0,sub=0,sha=0,amt=0,paid=0,days=0;
  for(const[d,e]of Object.entries(S.entries)){
    if(d<START)continue;const val=litres(e)*rateFor(d),p=Number(e.p)||0;
    if(d<first)prev+=val-p;
    else if(d<=last){sub+=Number(e.s)||0;sha+=Number(e.e)||0;amt+=val;paid+=p;if(!e.no&&litres(e)>0)days++}
  }
  return{first,last,prev,sub,sha,kul:sub+sha,amt,paid,days,baaki:prev+amt-paid};
}

function setLG(k,v){if(v==null||v===""){S.form[k+"L"]="";S.form[k+"G"]="";return}const[L,G]=splitLG(v);S.form[k+"L"]=String(L);S.form[k+"G"]=G?String(G):""}
function valLG(k){const f=S.form,L=num(f[k+"L"]),G=num(f[k+"G"]);if(L===null&&G===null)return null;if(isNaN(L)||isNaN(G))return NaN;return (L||0)+(G||0)/1000}
const emptyLG=k=>S.form[k+"L"]===""&&S.form[k+"G"]==="";
function loadForm(){const e=S.entries[S.date];S.form={p:e&&e.p?String(e.p):"",no:!!(e&&e.no),dirty:false};setLG("s",e&&!e.no?e.s:null);setLG("e",e&&!e.no?e.e:null)}
function nearestFilled(date){
  const ks=Object.keys(S.entries).filter(k=>k!==date&&k>=START&&!S.entries[k].no&&litres(S.entries[k])>0).sort();
  if(!ks.length)return null;const before=ks.filter(k=>k<date);return before.length?before[before.length-1]:ks[0];
}

function rangesText(days){
  const out=[];let st=null,pv=null;
  for(const d of days){if(st&&addDays(pv,1)===d){pv=d;continue}if(st)out.push([st,pv]);st=pv=d}
  if(st)out.push([st,pv]);
  const f=x=>{const d=parse(x);return d.getDate()+" "+MON[d.getMonth()].slice(0,3)};
  return out.map(([a,b])=>a===b?f(a):f(a)+" – "+f(b)).join(", ");
}

async function saveEntry(){
  const f=S.form,err=$("#err")||{textContent:""};err.textContent="";
  if(!f)return true;
  if(!f.dirty&&S.entries[S.date]){toast("Pehle se save hai ✔");return true}
  if(["sG","eG"].some(k=>!f.no&&f[k]!==""&&num(f[k])>999)){err.textContent="Gram 0 se 999 ke beech likho. Jaise 350";return false}
  const s=f.no?0:valLG("s"),e=f.no?0:valLG("e"),p=num(f.p);
  if([s,e].some(x=>x!==null&&(isNaN(x)||x<0||x>100))){err.textContent="Litre 0 se 100 ke beech likho";return false}
  if(p!==null&&(isNaN(p)||p<0||p>500000)){err.textContent="Paisa sirf number me likho. Jaise 5000";return false}

const QKEY="rajdairy_queue_v1";let QFLAG=false;
function qLoad(){try{return JSON.parse(localStorage.getItem(QKEY)||"{}")||{}}catch(_){return {}}}
function qSave(){try{localStorage.setItem(QKEY,JSON.stringify(QUEUE))}catch(_){}}
let QUEUE=qLoad();
const qCount=()=>Object.keys(QUEUE).length;
function rawWrite(path,body){return Promise.race([S.db.doc(path).set(body),new Promise((_,no)=>setTimeout(()=>no({code:"timeout",message:"slow"}),15000))])}
async function writeDoc(path,body){
  try{await rawWrite(path,body)}
  catch(x){
    if(!(x&&(x.code==="unavailable"||x.code==="timeout")))throw x;
    try{await new Promise(r=>setTimeout(r,800+Math.random()*700));await rawWrite(path,body)}
    catch(y){if(!(y&&(y.code==="unavailable"||y.code==="timeout")))throw y;QUEUE[path]=body;qSave();QFLAG=true;return "queued"}
  }
  if(QUEUE[path]){delete QUEUE[path];qSave()}
  return "saved";
}
let qBusy=false;
async function qFlush(manual){
  if(qBusy||!S.db||!qCount())return;qBusy=true;let n=0,fail=0;
  for(const[path,body]of Object.entries(Object.assign({},QUEUE))){
    try{await rawWrite(path,body);delete QUEUE[path];n++}catch(_){fail++}
  }
  qSave();qBusy=false;
  if(n)toast(`Net aa gaya — ${n} cheez bhej di ✔`);else if(manual&&fail)toast("Abhi bhi net nahi hai");
  render();
}
function qOverlay(prefix,map){for(const[path,body]of Object.entries(QUEUE)){if(path.startsWith(prefix+"/"))map[path.slice(prefix.length+1)]=body}return map}
window.addEventListener("online",()=>qFlush());
setInterval(()=>qFlush(),20000);
function errText(x){
  const c=x&&x.code;if(c==="timeout")return "Net bahut dheema hai. Thodi der me phir dabao.";
  if(c==="invalid_argument"){S.canWrite=false;return "Aapko entry karne ki permission nahi hai."}
  if(c==="unavailable")return "Internet nahi chal raha. Thodi der me phir dabao.";
  if(c==="too_large")return "Phone me jagah kam hai. Kuch photo/video hatao, phir dabao.";
  return "Save nahi hua. Phir se dabao.";
}

/* ================= FARM: gaay, kharcha, munafa ================= */
const GEST=283;
const gestOf=c=>c&&c.kind==="bhains"?310:283;
const TYPES={chara:"Chara-daana",dawai:"Dawai / Doctor",farm:"Farm kharcha"};
const NOTEHINT={chara:"jaise: bhusa 5 bori",dawai:"jaise: bukhar ka injection",farm:"jaise: bijli bill, mazdoor"};
const EV={siman:"Siman dala",garbh:"Garbh pakka",byaai:"Byaai / doodh shuru",sookhi:"Doodh band (sookhi)"};
const EVL=Object.assign({doodh:"Doodh de rahi thi (jab li)"},EV);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function cowList(){return Object.entries(S.cows).map(([id,c])=>Object.assign({id},c)).sort((a,b)=>(a.buy||"")<(b.buy||"")?-1:(a.buy||"")>(b.buy||"")?1:(a.name||"").localeCompare(b.name||""))}
const activeOn=(c,d)=>(!c.buy||c.buy<=d)&&(!c.end||c.end>d);
const activeCows=d=>cowList().filter(c=>activeOn(c,d));
const cowName=id=>id==="all"?"Sab gaay":(S.cows[id]?S.cows[id].name:"(hatai gayi gaay)");
function ymAdd(ym,n){const[y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function monthEnd(ym){const[y,m]=ym.split("-").map(Number);return ym+"-"+pad(new Date(y,m,0).getDate())}
const ymLabel=ym=>MON[Number(ym.slice(5))-1].slice(0,3)+" "+ym.slice(0,4);
const dDiff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const fmtS=s=>{const d=parse(s);return d.getDate()+" "+MON[d.getMonth()].slice(0,3)+" "+d.getFullYear()};
const PK={m:{n:1,t:"Is mahine"},y:{n:12,t:"Poore saal"}};
function periodOf(kind,ym){
  const n=PK[kind].n;let sm=ym;
  if(n>1){const[y,m]=ym.split("-").map(Number);const fy=m>=4?y:y-1;const off=((m-4)%12+12)%12;sm=ymAdd(fy+"-04",Math.floor(off/n)*n)}
  const months=[];for(let i=0;i<n;i++)months.push(ymAdd(sm,i));
  const label=n===1?MON[Number(sm.slice(5))-1]+" "+sm.slice(0,4):ymLabel(months[0])+" – "+ymLabel(months[n-1]);
  return{first:months[0]+"-01",last:monthEnd(months[n-1]),months,label};
}
function incomeIn(first,last){let L=0,amt=0;for(const[d,e]of Object.entries(S.entries)){if(d<START||d<first||d>last)continue;L+=litres(e);amt+=litres(e)*rateFor(d)}return{L,amt}}
function expensesIn(first,last){
  const r={chara:0,dawai:0,farm:0,total:0,perCow:{},unassigned:0,list:[]};
  for(const[id,x]of Object.entries(S.exp)){
    if(!x||x.date<first||x.date>last)continue;const a=Number(x.amt)||0;
    r[x.type]=(r[x.type]||0)+a;r.total+=a;r.list.push(Object.assign({id},x));
    if(x.type==="farm")continue;
    if(x.cow&&x.cow!=="all")r.perCow[x.cow]=(r.perCow[x.cow]||0)+a;
    else{const ac=activeCows(x.date);if(!ac.length)r.unassigned+=a;else ac.forEach(c=>{r.perCow[c.id]=(r.perCow[c.id]||0)+a/ac.length})}
  }
  r.list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0));return r;
}
function prodIn(first,last){
  const per={};let tot=0;
  for(const[d,p]of Object.entries(S.prod)){if(d<first||d>last||!p||!p.cows)continue;
    for(const[cid,v]of Object.entries(p.cows)){const l=(Number(v.s)||0)+(Number(v.e)||0);if(!per[cid])per[cid]={L:0,days:0};per[cid].L+=l;per[cid].days++;tot+=l}}
  return{per,tot};
}

/* ---- kundli ---- */
function cowEvents(c){return (c.events||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
function kundli1(c){
  const ev=cowEvents(c),t=today();
  let milking=false,lastByaai=null;
  for(const e of ev){if(e.d>t)continue;if(e.t==="byaai"){milking=true;lastByaai=e.d}if(e.t==="doodh")milking=true;if(e.t==="sookhi")milking=false}
  // cycles: siman count until garbh
  const cycles=[];let sim=[],cur=null;
  for(const e of ev){
    if(e.t==="siman")sim.push(e.d);
    if(e.t==="garbh"){const succ=sim.length?sim[sim.length-1]:null;cur={tries:sim.length,succ,confirm:e.d,due:succ?addDays(succ,gestOf(c)):null,born:null};cycles.push(cur);sim=[]}
    if(e.t==="byaai"){if(cur&&!cur.born&&e.d>=cur.confirm)cur.born=e.d;sim=[];cur=null}
  }
  const open=cycles.length&&!cycles[cycles.length-1].born?cycles[cycles.length-1]:null;
  const pendingSiman=sim; // siman after last garbh/byaai, no garbh yet
  // milking days in last 12 months (only owned days)
  const winStart=addDays(t,-365),own=c.buy&&c.buy>winStart?c.buy:winStart,ownEnd=c.end&&c.end<t?c.end:t;
  let state=null,mDays=0,cursor=own;
  for(const e of ev){if(e.d<=own){if(e.t==="byaai"||e.t==="doodh")state=true;if(e.t==="sookhi")state=false}}
  for(const e of ev){if(e.d<=own||e.d>ownEnd)continue;if(e.t!=="byaai"&&e.t!=="sookhi"&&e.t!=="doodh")continue;if(state)mDays+=dDiff(cursor,e.d);cursor=e.d;state=e.t!=="sookhi"}
  if(state)mDays+=dDiff(cursor,ownEnd);
  const ownDays=Math.max(0,dDiff(own,ownEnd));
  const known=ev.some(e=>e.t==="byaai"||e.t==="sookhi"||e.t==="doodh");
  return{milking,lastByaai,cycles,open,pendingSiman,mMonths:mDays/30.4,ownMonths:ownDays/30.4,known};
}
const m1=x=>(Math.round(x*2)/2).toLocaleString("en-IN");
function cowStatus(c){
  if(c.end)return{cls:"off",t:"Hata di"};
  const k=kundli(c);
  if(k.open&&k.open.due){const mo=Math.max(0,Math.floor(dDiff(k.open.succ,today())/30.4));return{cls:"preg",t:`Garbhvati · ${mo} mahine`}}
  if(k.pendingSiman.length)return{cls:"sim",t:`Siman hua (${k.pendingSiman.length} baar)`};
  if(k.milking)return{cls:"milk",t:"Doodh de rahi"};
  if(k.known)return{cls:"dry",t:"Sookhi"};
  return{cls:"off",t:"Kundli khali"};
}
function cowAlerts1(){
  const t=today(),out=[];
  for(const c of activeCows(t)){
    const k=kundli(c);
    if(k.open&&k.open.due){const left=dDiff(t,k.open.due);
      if(left<=30&&left>=-15)out.push({c,cls:"warn",t:left>=0?`${c.name}: byaai ${left} din me (${fmtS(k.open.due)})`:`${c.name}: byaai ki tareekh nikal gayi — byaai hui to likho`});
      else if(k.milking&&dDiff(t,addDays(k.open.due,-60))<=0)out.push({c,cls:"info",t:`${c.name}: doodh band (sookhi) karne ka time — byaai ${fmtS(k.open.due)}`});
    }
    if(k.pendingSiman.length){const last=k.pendingSiman[k.pendingSiman.length-1],g=dDiff(last,t);
      if(g>=60)out.push({c,cls:"info",t:`${c.name}: siman ko ${g} din ho gaye — garbh check karao`})}
  }
  return out;
}

/* ---- production form ---- */
function perCowOn(){return false}
function prevProd(date){const ks=Object.keys(S.prod).filter(k=>k<date).sort();return ks.length?ks[ks.length-1]:null}
function loadPform(){
  const p=S.prod[S.pdate];S.pform={dirty:false,v:{}};
  activeCows(S.pdate).forEach(c=>{const x=p&&p.cows&&p.cows[c.id];
    if(x){const[a,b]=splitLG(x.s),[c2,d]=splitLG(x.e);S.pform.v[c.id]={sL:String(a),sG:b?String(b):"",eL:String(c2),eG:d?String(d):""}}
    else S.pform.v[c.id]={sL:"",sG:"",eL:"",eG:""}});
}
const pv=(v,k)=>(num(v[k+"L"])||0)+(num(v[k+"G"])||0)/1000;
function ptotal(){let s=0;for(const v of Object.values(S.pform.v))s+=pv(v,"s")+pv(v,"e");return s}
async function saveProd(){
  const err=$("#perr")||{textContent:""};err.textContent="";
  if(!S.pform)return true;
  const cows={};
  for(const[cid,v]of Object.entries(S.pform.v)){
    if(["sG","eG"].some(k=>num(v[k])>999)){err.textContent=`${cowName(cid)}: gram 0 se 999 ke beech likho`;return false}
    const s=pv(v,"s"),e=pv(v,"e");if(s>60||e>60){err.textContent=`${cowName(cid)}: itna doodh sahi nahi lagta`;return false}
    if(v.sL!==""||v.sG!==""||v.eL!==""||v.eG!=="")cows[cid]={s:Math.round(s*1000)/1000,e:Math.round(e*1000)/1000};
  }
  if(!Object.keys(cows).length){err.textContent="Kam se kam ek gaay ka doodh likho";return false}
  const b=$("#psave");if(b){b.disabled=true;b.textContent="Save ho raha hai…"}
  try{await writeDoc("prod/"+S.pdate,{cows,at:Date.now()});S.prod[S.pdate]={cows};S.pform.dirty=false;toast("✔ Gaay ka doodh save");render();return true}
  catch(x){if(b){b.disabled=false;b.textContent="SAVE KARO"}err.textContent=errText(x);return false}
}

    <div><span>Doodh bika (${lt(inc.L)})</span><b class="pos">+ ${rs(inc.amt)}</b></div>

  </div>
  ${bars}

}

function curQty(it){return Math.max(0,(Number(it.qty)||0)-(Number(it.perDay)||0)*Math.max(0,dDiff(it.asOf||today(),today())))}
function daysLeft(it){const p=Number(it.perDay)||0;return p>0?Math.floor(curQty(it)/p):null}
const q2=n=>(Math.round(n*10)/10).toLocaleString("en-IN");

/* expenses incl. fix kharcha (override) */
function expensesIn(first,last){
  const r={chara:0,dawai:0,farm:0,total:0,loan:0,perCow:{},unassigned:0,list:[]};
  const add=(x,id)=>{const a=Number(x.amt)||0;if(x.type==="loan"){r.loan+=a;r.list.push(Object.assign({id},x));return}r[x.type]=(r[x.type]||0)+a;r.total+=a;r.list.push(Object.assign({id},x));
    if(x.type==="farm")return;
    if(x.cow&&x.cow!=="all")r.perCow[x.cow]=(r.perCow[x.cow]||0)+a;
    else{const ac=activeCows(x.date);if(!ac.length)r.unassigned+=a;else ac.forEach(c=>{r.perCow[c.id]=(r.perCow[c.id]||0)+a/ac.length})}};
  for(const[id,x]of Object.entries(S.exp)){if(x&&x.date>=first&&x.date<=last)add(x,id)}
  const t=today();
  for(const f of fixedList()){
    let ym=(f.from||START).slice(0,7);const endYm=last.slice(0,7);let guardN=0;
    while(ym<=endYm&&guardN++<240){
      const dim=Number(monthEnd(ym).slice(8));const d=ym+"-"+pad(Math.min(Math.max(1,Number(f.day)||1),dim));
      if(d>=first&&d<=last&&d<=t&&d>=(f.from||START)&&(!f.to||d<=f.to))add({type:f.type||"farm",amt:f.amt,date:d,cow:(f.type||"farm")==="farm"?null:"all",note:f.name+" (fix)",fixed:true},"fx-"+f.id+"-"+ym);
      ym=ymAdd(ym,1);
    }
  }
  r.list.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0));return r;
}

/* kundli (override) with calves + byaai gap */
function kundli(c){
  const k=kundli1(c),ev=cowEvents(c),by=ev.filter(e=>e.t==="byaai").map(e=>e.d);
  const gaps=[];for(let i=1;i<by.length;i++)gaps.push(dDiff(by[i-1],by[i])/30.4);
  k.byGap=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:null;
  k.calfF=ev.filter(e=>e.t==="byaai"&&e.calf==="f").length;k.calfM=ev.filter(e=>e.t==="byaai"&&e.calf==="m").length;
  return k;
}
function prodDrop(c){
  const ds=Object.keys(S.prod).filter(d=>S.prod[d]&&S.prod[d].cows&&S.prod[d].cows[c.id]).sort();
  if(ds.length<6)return null;
  const v=d=>{const x=S.prod[d].cows[c.id];return (Number(x.s)||0)+(Number(x.e)||0)};
  const last=ds.slice(-3).map(v),prev=ds.slice(-10,-3).map(v);
  const a=last.reduce((s,x)=>s+x,0)/last.length,b=prev.reduce((s,x)=>s+x,0)/prev.length;
  return b>0&&a<b*0.8?Math.round((1-a/b)*100):null;
}
/* alerts (override) */
function cowAlerts(){
  const out=cowAlerts1();
  for(const c of activeCows(today())){
    const k=kundli(c);
    if(k.pendingSiman.length>=3)out.push({c,cls:"warn",t:`${c.name}: ${k.pendingSiman.length} baar siman, garbh nahi — doctor ko dikhao`});
  }
  return out;
}
/* tika due */
function healthDue(){
  const t=today(),out=[],H=healthList();
  for(const c of activeCows(t)){
    for(const[k,v]of Object.entries(HK)){if(!v.gap)continue;
      const recs=H.filter(h=>h.kind===k&&(h.cow===c.id||(h.cow==="all"&&(!c.at||!h.at||c.at<=h.at)))&&h.date<=t).sort((a,b)=>a.date<b.date?1:-1);
      if(!recs.length)continue;const due=recs[0].next||addDays(recs[0].date,v.gap);
      out.push({k,cow:c,due,last:recs[0].date});
    }
  }
  const g={};for(const x of out){const key=x.k+"|"+x.due;(g[key]=g[key]||{k:x.k,due:x.due,cows:[]}).cows.push(x.cow)}
  return Object.values(g).sort((a,b)=>a.due<b.due?-1:1);
}
const dueText=d=>{const n=dDiff(today(),d);return n<0?`${-n} din se baaki`:n===0?"aaj":`${n} din me (${fmtS(d)})`};

/* ---- avatar + photo ---- */
function cowAvatar(c,sz){sz=sz||44;return `<span class="ava" style="width:${sz}px;height:${sz}px">${cowSvg(sz)}${c&&c.photo?`<img src="${RDK.img(c.photo)}" alt="" onerror="this.remove()">`:""}</span>`}
async function uploadPhoto(id,file,er){
  try{
    const url=URL.createObjectURL(file);const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
    const m=Math.min(1,360/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*m);cv.height=Math.round(img.height*m);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.72));
    const res=await S.assets.upload(blob,{type:"image/jpeg"});
    const body=Object.assign({},S.cows[id],{photo:res.id});await writeDoc("cows/"+id,body);S.cows[id]=body;toast("✔ Photo lag gayi");render();cowSheet(id);
  }catch(x){er.textContent=x&&x.code==="too_large"?"Phone me jagah kam hai. Purani photo hatao ya backup lo":x&&x.code==="rate_limited"?"Thodi der baad try karo":"Photo nahi lagi. Phir try karo."}
}

  document.querySelectorAll("[data-sed]").forEach(b=>b.onclick=()=>stockSheet(b.dataset.sed,"edit"));
  $("#sAdd").onclick=()=>stockSheet(null);$("#fAdd").onclick=fixedSheet;
  document.querySelectorAll("[data-fend]").forEach(b=>b.onclick=async()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent="pakka?";return}
    const id=b.dataset.fend,body=Object.assign({},S.fixed[id],{to:today()});try{await writeDoc("fixed/"+id,body);S.fixed[id]=body;toast("Band kar diya");render()}catch(x){toast(errText(x))}});
  $("#xSave").onclick=async()=>{keep();const er=$("#xErr");er.textContent="";const a=num(S.ef.amt);
    if(a===null||isNaN(a)||a<=0){er.textContent="Kitna paisa laga, likho. Jaise 500";return}
    if(a>1000000){er.textContent="Itna bada kharcha sahi nahi lagta";return}
    if(!S.ef.date||S.ef.date<START||S.ef.date>t){er.textContent="Sahi tareekh chuno";return}
    const nid=newId(),body={type:S.ef.type,amt:a,date:S.ef.date,cow:S.ef.type==="farm"?null:(S.ef.cow||"all"),note:S.ef.note.trim(),at:Date.now()};
    const b=$("#xSave");b.disabled=true;b.textContent="Save ho raha hai…";
    try{await writeDoc("expenses/"+nid,body);S.exp[nid]=body;S.ef={type:S.ef.type,amt:"",date:S.ef.date,cow:S.ef.cow,note:""};S.emonth=body.date.slice(0,7);toast("✔ Kharcha save");render()}
    catch(x){b.disabled=false;b.textContent="KHARCHA SAVE KARO";er.textContent=errText(x)}};
}
function hToggle(){
  app.insertAdjacentHTML("afterbegin",`<div class="seg s2 htog"><button class="chip2" data-hv="pandey" aria-pressed="${S.hview!=="munafa"}">Pandey Ji ka hisaab</button><button class="chip2" data-hv="munafa" aria-pressed="${S.hview==="munafa"}">Munafa-nuksaan</button></div>`);
  document.querySelectorAll("[data-hv]").forEach(b=>b.onclick=()=>{S.hview=b.dataset.hv;render();window.scrollTo(0,0)});
}

function tikaCard(){
  const D=healthDue().filter(d=>dDiff(today(),d.due)<=30);
  return `<div class="card set"><h2>Tika aur dawai</h2>${D.length?`<ul class="hist">${D.map(d=>`<li><span><b>${HK[d.k].t}</b><br><small class="small">${d.cows.map(c=>esc(c.name)).join(", ")}</small></span><span class="${dDiff(today(),d.due)<0?"neg":""}" style="text-align:right;font-weight:800">${dueText(d.due)}</span></li>`).join("")}</ul>`:`<p class="small" style="margin:0">${healthList().length?"Agle 30 din me koi tika baaki nahi.":"Aakhri tika kab laga, likh do — agla kab hai, app yaad dilayega."}</p>`}
   <button class="chunk green" id="hAdd">+ Tika / dawai likho</button></div>`;
}


function render(){
  $("#shopName").textContent=shop();
  if(!S.ready){app.innerHTML=`<div class="card"><p style="margin:0;font-weight:700">Khata khul raha hai…</p></div>`;return}
  app.className=S.tab==="entry"?"entry":"";
  if(S.tab==="aaj")renderAaj();else if(S.tab==="entry")renderEntry();else if(S.tab==="hisaab"){if(S.hview==="munafa")renderMunafa();else renderHisaab();hToggle()}else if(S.tab==="gaay")renderGaay();else if(S.tab==="kharcha")renderKharcha();else if(S.tab==="munafa"){S.tab="hisaab";S.hview="munafa";renderMunafa();hToggle()}else renderSetting();
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setTab(b.dataset.go));
  document.querySelectorAll("[data-qflush]").forEach(b=>b.onclick=()=>qFlush(true));
}

async function start(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(_){db=null}
  S.db=db;
  if(!db){S.ready=true;render();return}
  try{const u=await window.claude.use("user");if(u&&u.can){const w=await u.can("data.write");if(w===false)S.canWrite=false}}catch(_){}
  let gotE=false,gotS=false;
  const done=()=>{if(gotE&&gotS&&!S.ready){S.ready=true;render()}};
  const typing=()=>document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  db.doc("settings/main").onSnapshot(s=>{S.settings=QUEUE["settings/main"]||(s.exists?s.data():null);gotS=true;if(S.ready&&!typing())render();done()},()=>{gotS=true;done()});
  db.collection("entries").onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S.entries=qOverlay("entries",m);gotE=true;
    if(S.ready&&!typing()){if(S.tab==="entry"&&S.form&&!S.form.dirty){S.form=null;render()}else if(S.tab==="hisaab"||S.tab==="aaj")render()}
    done();
  },()=>{gotE=true;done()});
  const coll=(name,key,tabs)=>db.collection(name).onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});S[key]=qOverlay(name,m);
    if(S.ready&&!typing()&&!$("#sheet")&&tabs.includes(S.tab)){if(key!=="exp"&&S.pform&&!S.pform.dirty)S.pform=null;render()}},()=>{});
  coll("cows","cows",["aaj","gaay","hisaab","kharcha"]);coll("expenses","exp",["aaj","kharcha","hisaab","gaay"]);coll("prod","prod",["aaj","gaay","hisaab"]);
  coll("health","health",["aaj","gaay"]);coll("stock","stock",["aaj","kharcha"]);coll("fixed","fixed",["aaj","kharcha","hisaab"]);
  try{window.claude.use("assets").then(a=>{S.assets=a||null}).catch(()=>{})}catch(_){}
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},8000);
  setTimeout(()=>qFlush(),3000);
  try{window.claude.use("downloads").then(d=>{S.dl=d||null;if(S.tab==="hisaab")render()}).catch(()=>{})}catch(_){}
}
let lastToday=today();
function checkDay(){
  const t=today();if(t===lastToday)return;const old=lastToday;lastToday=t;
  if(S.date===old&&!(S.form&&S.form.dirty)){S.date=t;S.form=null}
  if(S.month===old.slice(0,7))S.month=t.slice(0,7);
  if(S.pym===old.slice(0,7))S.pym=t.slice(0,7);
  if(S.emonth===old.slice(0,7))S.emonth=t.slice(0,7);
  if(S.ef&&S.ef.date===old&&!S.ef.amt)S.ef.date=t;
  if(S.pdate===old&&!(S.pform&&S.pform.dirty)){S.pdate=t;S.pform=null}
  const ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))render();
}
setInterval(checkDay,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
window.addEventListener("focus",checkDay);
window.addEventListener("pageshow",checkDay);
render();start();
})();
</script>
